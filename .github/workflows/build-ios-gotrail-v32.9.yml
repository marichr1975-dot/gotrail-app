name: GoTr-Ail iOS V32.9

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Prepare shared DerivedData
        run: |
          rm -rf "$RUNNER_TEMP/GoTrailSharedDerivedData"
          mkdir -p "$RUNNER_TEMP/GoTrailSharedDerivedData"

      - name: Build CoreApi
        run: |
          xcodebuild -project iphone/CoreApi/CoreApi.xcodeproj -scheme CoreApi -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build Chart
        run: |
          xcodebuild -project iphone/Chart/Chart.xcodeproj -scheme Chart -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build timezone
        run: |
          xcodebuild -project xcode/timezone/timezone.xcodeproj -scheme timezone -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify GoTr-Ail AppIcon
        run: test -d "iphone/Maps/Resources/Images.xcassets/AppIcon.appiconset"

      - name: Build OMaps
        run: |
          xcodebuild -workspace xcode/omim.xcworkspace -scheme OMaps -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify GoTr-Ail V32.9 source
        run: |
          grep -q 'analyze.setTitle("ANALIZZA ZONA", for: .normal)' iphone/Maps/Core/AppDelegate/MainSceneDelegate.swift
          ! grep -q 'let topBar = UIView()' iphone/Maps/Core/AppDelegate/MainSceneDelegate.swift
          grep -q '_tabBarController.isHidden = self.hidden;' iphone/Maps/UI/Map/MapViewControls/MWMMapViewControlsManager.mm
          echo "VERIFICA SORGENTE V32.9 OK"

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$RUNNER_TEMP/GoTrailSharedDerivedData/Build/Products" -type d -name "*.app" -print -quit)
          test -n "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f "GoTr-Ail-iOS-V32.9-unsigned.ipa"
          zip -qry "GoTr-Ail-iOS-V32.9-unsigned.ipa" Payload
          ls -lh "GoTr-Ail-iOS-V32.9-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoTr-Ail-iOS-V32.9-unsigned
          path: ${{ runner.temp }}/GoTr-Ail-iOS-V32.9-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GoTr-Ail-iOS-V32.9-build-logs
          path: ${{ runner.temp }}/GoTrailSharedDerivedData/Logs
          if-no-files-found: ignore
