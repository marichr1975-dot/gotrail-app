name: GoTr-Ail iOS V32.7

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Prepare shared DerivedData
        run: |
          rm -rf "$RUNNER_TEMP/GoTrailSharedDerivedData"
          mkdir -p "$RUNNER_TEMP/GoTrailSharedDerivedData"

      - name: Build CoreApi
        run: |
          xcodebuild -project iphone/CoreApi/CoreApi.xcodeproj -scheme CoreApi -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build Chart
        run: |
          xcodebuild -project iphone/Chart/Chart.xcodeproj -scheme Chart -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build timezone
        run: |
          xcodebuild -project xcode/timezone/timezone.xcodeproj -scheme timezone -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          find "$RUNNER_TEMP/GoTrailSharedDerivedData" -name "libtimezone.a" -print

      - name: Verify GoTr-Ail AppIcon
        run: |
          test -d "iphone/Maps/Resources/Images.xcassets/AppIcon.appiconset"

      - name: Build OMaps
        run: |
          xcodebuild -workspace xcode/omim.xcworkspace -scheme OMaps -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/GoTrailSharedDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/GoTrailSharedDerivedData/Build/Products/Release-iphoneos/OMaps.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "GoTr-Ail-iOS-V32.7-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoTr-Ail-iOS-V32.7-unsigned
          path: ${{ runner.temp }}/GoTr-Ail-iOS-V32.7-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GoTr-Ail-iOS-V32.7-build-logs
          path: ${{ runner.temp }}/GoTrailSharedDerivedData
          if-no-files-found: ignore
